project:
  name: cat_notcat_garden_dataset
  version: "1.1-script"
  purpose: "Edge Impulse CAT vs NO_CAT garden classifier"

dataset:
  image_width: 192
  image_height: 192
  color_mode: grayscale
  final_format: jpg
  jpeg_quality: 95
  orientation: upright
  add_blur: false
  add_noise: false

targets:
  cat_train: 100
  no_cat_train: 120
  cat_test: 20
  no_cat_test: 20

existing_dataset:
  # The previous 40/40 train + 20/20 test bundle.
  # The build script keeps its 20+20 test images locked and reuses its
  # 40+40 training images, then adds newly approved training candidates.
  expected_filename: "EI192_APPROVED_40_40_TRAIN_20_20_TEST_UPRIGHT_20260927.zip"
  sha256: "291dc2bd5417599df0ac3036385d6f466ace2f9b0ff8dd32cd1a58dfc41b58b7"
  cat_train_count: 40
  no_cat_train_count: 40
  cat_test_count: 20
  no_cat_test_count: 20
  lock_test_set: true

generation:
  preview_size: "1024x1024"
  preview_quality: high
  output_format: png
  model: "gpt-image-2"
  one_candidate_per_request: true
  preserve_source_background: true
  use_supplied_garden_photos_only: true
  allow_contact_sheets: false
  allow_augmentation_copies: false
  allow_near_duplicates: false
  add_text_or_labels_to_pixels: false

garden_sources:
  directory: "garden_sources"
  filenames:
    - IMG_20260912_151229.jpg
    - IMG_20260912_151232.jpg
    - IMG_20260912_151235.jpg
    - IMG_20260912_151239.jpg
    - IMG_20260912_151242.jpg
    - IMG_20260912_151246.jpg
    - IMG_20260912_151251.jpg
    - IMG_20260912_151259.jpg
    - IMG_20260912_151301.jpg
    - IMG_20260912_151303.jpg
    - IMG_20260912_151307.jpg
    - IMG_20260912_151309.jpg
    - IMG_20260912_151313.jpg
    - IMG_20260912_151314.jpg
    - IMG_20260912_151316.jpg
    - IMG_20260912_151317.jpg

cat:
  distance_m:
    min: 1.0
    max: 3.0
    preferred_far_fraction: 0.30
  placement: grass_only
  coats:
    - tabby
    - black
    - black_and_white
    - white
    - ginger
    - tortoiseshell
    - fluffy_tabby
    - fluffy_black_and_white
    - short_haired_tabby
  poses:
    - sitting
    - walking
    - lying_down
    - crouching
    - stalking
    - squatting_defecating
  directions:
    - left
    - right
    - toward_camera
    - away_from_camera
    - diagonal_left
    - diagonal_right
    - rear_three_quarter
    - looking_back
  rules:
    - "Cat must be on grass."
    - "Cat scale must match perspective and grass texture."
    - "Cat must have believable ground contact."
    - "No floating or sunken cats."
    - "No cats on fences, walls, roofs, benches, furniture, paths or paving."
    - "No tiny distant cats beyond the useful 1-3 metre operating range."
    - "Prefer genuinely different pose/background/direction combinations."

no_cat:
  mix_weights:
    empty_garden: 0.10
    birds: 0.35
    people: 0.25
    objects: 0.20
    shadows: 0.10
  birds:
    - pigeon_single
    - pigeon_pair
    - magpie_single
    - magpie_pair
    - crow_single
    - crow_pair
    - blackbird
    - robin_on_grass
    - thrush
  people:
    - walking_person_lower_body
    - crouching_gardener
    - gardener_weeding
  objects:
    - watering_can
    - wheelie_bin
    - rake
  shadows:
    - tree_shadow
    - branch_shadow
    - strong_sun_shade_boundary
  exclusions:
    - rabbit
    - dog
    - fox
    - hedgehog
    - hedgehog_babies
    - robin_on_birdbath
    - isolated_boots
    - night_scene
    - infrared_scene
  rules:
    - "No cat anywhere in the image."
    - "People must be naturally attached; no standalone boots."
    - "Distractors must be grounded and correctly scaled."
    - "No pasted rectangles, halos or obvious extraction artefacts."
    - "Use realistic daytime garden scenes only."

quality_control:
  candidate_statuses:
    - pending
    - approved
    - rejected
  require_manual_approval: true
  required_checks:
    - supplied_garden_background
    - distinct_scene
    - realistic_scale
    - realistic_perspective
    - realistic_lighting
    - believable_grounding
    - no_extraction_artifacts
    - correct_class
  exact_duplicate_check: true
  final_dimensions_check: true
  final_grayscale_check: true

packaging:
  final_folders:
    - cat_train
    - no_cat_train
    - cat_test
    - no_cat_test
  manifest_inside_final_zip: false
