; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = secrets.ini

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200


# Convert those secrets into global code macros automatically
# String escape wrappers \"...\" guarantee the text compiles as literal strings
build_flags =
    -DSECRET_SSID=\"${wifi_credentials.wifi_ssid}\"
    -DSECRET_PASS=\"${wifi_credentials.wifi_pass}\"
    -DSECRET_TOKEN=\"${telegram_credentials.bot_token}\"
    -DSECRET_ID=\"${telegram_credentials.chat_id}\"

lib_deps =
    # Pulls the official Seeed SSCMA library for the Vision AI V2
    https://github.com/Seeed-Studio/Seeed_Arduino_SSCMA
    # Adds the missing library requirement for parsing camera metadata
    bblanchon/ArduinoJson @ ^7.0.0

    

