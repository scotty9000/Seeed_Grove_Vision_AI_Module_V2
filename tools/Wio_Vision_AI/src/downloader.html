<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GC-BLE Automated Image Hub</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; background: #f0f4f8; padding: 20px; color: #333; }
        .card { background: white; max-width: 480px; margin: 20px auto; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e1e8ed; }
        h2 { margin-top: 0; color: #1e293b; font-size: 24px; }
        p { color: #64748b; font-size: 14px; margin-bottom: 25px; }
        button { background: #2563eb; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer; margin: 10px 0; width: 100%; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        select { padding: 12px; font-size: 16px; width: 100%; margin: 10px 0; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; color: #334155; }
        #status { font-weight: 500; margin: 20px 0; color: #475569; font-size: 15px; padding: 10px; background: #f8fafc; border-radius: 6px; }
        #metadata { margin: 15px 0; color: #15803d; font-weight: 600; background: #f0fdf4; padding: 12px; border-radius: 8px; border: 1px solid #bbf7d0; display: none; font-size: 14px; }
        img { max-width: 100%; border-radius: 12px; margin-top: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        .progress-bar { width: 100%; background-color: #e2e8f0; border-radius: 4px; margin-top: 10px; display: none; }
        .progress-fill { height: 8px; background-color: #2563eb; width: 0%; border-radius: 4px; transition: width 0.1s; }
    </style>
</head>
<body>

<div class="card">
    <h2>GC-BLE Image Viewer</h2>
    <p>Pull buffered images directly from your garden camera completely offline.</p>
    
    <button id="connectBtn">1. Connect to GC-BLE</button>
    
    <div id="controls" style="display:none;">
        <label for="slotSelect" style="display:block; text-align:left; font-size:14px; font-weight:600; color: #475569; margin-bottom: 5px;">Select Memory Slot:</label>
        <select id="slotSelect">
            <option value="0">Slot 0</option>
            <option value="1">Slot 1</option>
            <option value="2">Slot 2</option>
            <option value="3">Slot 3</option>
        </select>
        <button id="downloadBtn">2. Download & Render Image</button>
        <button id="clearBtn" style="background: #dc2626; margin-top: 5px;">🧹 Clear All Slots</button>

    </div>

    <div id="status">Status: Disconnected</div>
    <div id="globalCounter" style="margin: 15px 0; color: #1e3a8a; font-weight: 700; background: #dbeafe; padding: 12px; border-radius: 8px; border: 1px solid #bfdbfe; display: none; font-size: 15px;">
        Matches Detected: 0
    </div>
    <div id="metadata"></div>
    <div class="progress-bar" id="progressOuter"><div class="progress-fill" id="progressInner"></div></div>
    <div id="imgContainer"></div>
</div>

<script>
// Exact UUID addresses matching your XIAO C3 firmware configuration
const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
const META_CHAR_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
const CONTROL_CHAR_UUID = "e3223119-9445-4e7d-8700-d5382c474d21";
const STREAM_CHAR_UUID = "622a5785-5ee6-4e58-9cf8-6628fb05cf71";

let gattServer = null;
let controlChar = null;
let metaChar = null;
let streamChar = null;
let counterChar = null;

// STEP A: Handle Core Bluetooth Device Connection
document.getElementById('connectBtn').addEventListener('click', async () => {
    try {
        document.getElementById('status').innerText = "Status: Scanning for GC-BLE...";
        const device = await navigator.bluetooth.requestDevice({
            filters: [{ name: 'GC-BLE' }],
            optionalServices: [SERVICE_UUID]
        });

        document.getElementById('status').innerText = "Status: Connecting to device...";
        gattServer = await device.gatt.connect(); 

        document.getElementById('status').innerText = "Status: Initialising secure services...";
        const service = await gattServer.getPrimaryService(SERVICE_UUID);

        controlChar = await service.getCharacteristic(CONTROL_CHAR_UUID);
        metaChar = await service.getCharacteristic(META_CHAR_UUID);
        streamChar = await service.getCharacteristic(STREAM_CHAR_UUID);
        counterChar = await service.getCharacteristic("d8a1c322-1f45-4e7d-8700-d5382c474d21");

        const initialCounterVal = await counterChar.readValue();
        const initialMatches = initialCounterVal.getUint32(0, true);
        document.getElementById('globalCounter').innerText = `TOTAL MATCHES: ${initialMatches}`;
        document.getElementById('globalCounter').style.display = 'block';

        // 🌟 THE FIX: Yield a brief 50ms breathing window for the C3 radio to clear its queue
        await new Promise(resolve => setTimeout(resolve, 50));

        // LIVE AUTO-UPDATE ENGINE (Listens to the air rails in real-time)
        const handleLiveCounterUpdate = (event) => {
            const rawVal = event.target.value;
            const liveMatches = rawVal.getUint32(0, true);
            
            // Instantly increments your phone screen banner layout alongside your serial feed!
            document.getElementById('globalCounter').innerText = `📊 TOTAL GARDEN MATCHES: ${liveMatches}`;
            console.log(`[LIVE ALERT] Match Counter Auto-Incremented to: ${liveMatches}`);
        };

        // Bind the background hardware listener to the counter channel
        await counterChar.startNotifications();
        counterChar.addEventListener('characteristicvaluechanged', handleLiveCounterUpdate);

        document.getElementById('status').innerText = "Status: Connected and ready!";
        document.getElementById('connectBtn').style.display = 'none';
        document.getElementById('controls').style.display = 'block';
    } catch (error) {
        document.getElementById('status').innerText = "Connection Failed: " + error.message;
        console.error(error);
    }
});

// STEP B: Bounded Bounded Downloader with Step-by-Step Telemetry
document.getElementById('downloadBtn').addEventListener('click', async () => {
    const slot = document.getElementById('slotSelect').value;
    document.getElementById('status').innerText = "Status: Requesting Slot [" + slot + "]...";
    document.getElementById('downloadBtn').disabled = true;
    document.getElementById('metadata').style.display = 'none';
    document.getElementById('progressOuter').style.display = 'none';
    document.getElementById('progressInner').style.width = '0%';

    console.log(`\n=================== [📡 TELEMETRY PASS START] ===================`);
    console.log(`[1] Selected Slot Target: "${slot}" (Parsed Int: ${parseInt(slot)})`);

    try {
        // Send initial single slot selection byte
        const slotByte = new Uint8Array([parseInt(slot)]);
        console.log(`[2] Sending Initial Slot Configuration Byte: [0x${slotByte[0].toString(16).toUpperCase().padStart(2, '0')}]`);
        await controlChar.writeValueWithResponse(slotByte);
        
        console.log(`[3] Pausing 400ms for hardware pointer alignment...`);
        await new Promise(resolve => setTimeout(resolve, 400)); 

        // Read and parse metadata row size metrics
        console.log(`[4] Requesting Metadata Characteristic raw read...`);
        const metaVal = await metaChar.readValue();
        const decoder = new TextDecoder();
        const metaText = decoder.decode(metaVal);

        console.log(` -> Raw Metadata Received String: "${metaText}"`);
        document.getElementById('metadata').innerText = metaText;
        document.getElementById('metadata').style.display = 'block';

        let totalBytesExpected = 0;
        const lengthMatch = metaText.match(/Length:\s*(\d+)/);
        if (lengthMatch) {
            totalBytesExpected = parseInt(lengthMatch[1]);
            console.log(` -> Match extraction success. Bytes expected: ${totalBytesExpected}`);
        } else {
            console.warn(` -> ⚠️ Regular Expression failed to find a valid 'Length: XX' number inside text!`);
        }

        if (totalBytesExpected === 0) {
            console.error(` -> ❌ Terminating: Bailing because expected bytes computed to 0.`);
            document.getElementById('status').innerText = "Status: Selected slot contains no valid image data.";
            document.getElementById('downloadBtn').disabled = false;
            return;
        }

        const maxChunkSize = 240;
        const totalCallsNeeded = Math.ceil(totalBytesExpected / maxChunkSize);

        console.log(`[5] MATH VERIFICATION:`);
        console.log(` -> Formula Run: Math.ceil(${totalBytesExpected} / ${maxChunkSize})`);
        console.log(` -> Total Calls Needed Allocation: ${totalCallsNeeded}`);
        console.log(`----------------------------------------------------------------`);

        let fileChunks = [];
        let downloadedBytes = 0;
        
        document.getElementById('status').innerText = "Status: Transferring image over BLE air rails...";
        document.getElementById('progressOuter').style.display = 'block';

        // Loop execution with granular iteration print tracing
        for (let callIndex = 0; callIndex < totalCallsNeeded; callIndex++) {
            console.log(`\n--- Loop Cycle Iteration Index: #${callIndex} (Call ${callIndex + 1}/${totalCallsNeeded}) ---`);
            
            if (callIndex > 0) {
                const commandPacket = new Uint8Array([parseInt(slot), callIndex]);
                
                // Print the raw array bytes Chrome is passing to the Bluetooth stack
                let packetHexStr = "";
                commandPacket.forEach(b => packetHexStr += "0x" + b.toString(16).toUpperCase().padStart(2, '0') + " ");
                console.log(` -> [📦 PRE-FLIGHT OUTBOUND] Preparing 2-byte instruction envelope.`);
                console.log(`    -> Raw Uint8Array Length: ${commandPacket.length} elements.`);
                console.log(`    -> Byte array configuration: [ ${packetHexStr}]`);
                
                console.log(` -> Executing writeValue()...`);
                await controlChar.writeValue(commandPacket);
                console.log(` -> writeValue() complete. Yielding 25ms delay for hardware stabilization...`);
                await new Promise(resolve => setTimeout(resolve, 25)); 
            } else {
                console.log(` -> Skipping outbound command write pass (CallIndex is 0). Reading initial hardware buffer.`);
            }

            console.log(` -> Executing streamChar.readValue()...`);
            const rawChunk = await streamChar.readValue();
            
            // 🌟 UNIVERSAL CORRECTION: Force Chrome to extract the exact slice size
            // By wrapping rawChunk directly, it uses the precise byteLength boundaries (240 then 114)
            const chunkArray = new Uint8Array(rawChunk.buffer, rawChunk.byteOffset, rawChunk.byteLength);
            
            console.log(` -> readValue() complete. Received packet size: ${rawChunk.byteLength} bytes.`);

            let chunkHexStr = "";
            for(let i=0; i<Math.min(chunkArray.length, 6); i++) {
                chunkHexStr += "0x" + chunkArray[i].toString(16).toUpperCase().padStart(2, '0') + " ";
            }
            console.log(` -> Received Chunk Frame Header Bytes: [ ${chunkHexStr}]`);
            
            fileChunks.push(chunkArray);
            downloadedBytes += rawChunk.byteLength;
            console.log(` -> Running Data Totals: ${downloadedBytes}/${totalBytesExpected} bytes accumulated.`);

            // Update local progress bar metrics
            const percent = Math.min(100, Math.floor((downloadedBytes / totalBytesExpected) * 100));
            document.getElementById('progressInner').style.width = percent + '%';
            document.getElementById('status').innerText = `Status: Downloading (${downloadedBytes}/${totalBytesExpected} bytes)...`;
        }

        console.log(`\n=================== [📥 TRANSFER CYCLE METRICS] ===================`);
        console.log(`Total calls processed: ${totalCallsNeeded}`);
        console.log(`Total raw data accumulated across arrays: ${downloadedBytes} bytes.`);

        let finalImageBuffer = new Uint8Array(downloadedBytes);
        let currentWriteOffset = 0;
        for (let chunk of fileChunks) {
            finalImageBuffer.set(chunk, currentWriteOffset);
            currentWriteOffset += chunk.length;
        }

        let fileHeaderHex = "";
        for(let i=0; i<Math.min(finalImageBuffer.length, 6); i++) {
            fileHeaderHex += "0x" + finalImageBuffer[i].toString(16).toUpperCase().padStart(2, '0') + " ";
        }
        console.log(` -> FINAL CONSOLIDATED PAYLOAD CONTAINER HEADER BYTES: [ ${fileHeaderHex}]`);
        console.log(`====================================================================`);

        document.getElementById('status').innerText = "Status: Rendering photo...";
        const completeBlob = new Blob([finalImageBuffer], { type: 'image/jpeg' });
        const imgUrl = URL.createObjectURL(completeBlob);

        document.getElementById('imgContainer').innerHTML = `<img src="${imgUrl}" alt="Garden Offline Capture" />`;
        document.getElementById('status').innerText = "Status: Transfer complete!";

    } catch (error) {
        console.error(`\n❌ [STREAM TIMEOUT/EXCEPTION ENCOUNTERED]:`);
        console.error(error);
        document.getElementById('status').innerText = "Stream Interrupted: " + error.message;
    } finally {
        document.getElementById('downloadBtn').disabled = false;
    }
});

// STEP C: Handshake to Wipe Device Memory
document.getElementById('clearBtn').addEventListener('click', async () => {
    if (!confirm("Are you sure you want to erase all 4 slots in the garden camera?")) return;
    
    document.getElementById('status').innerText = "Status: Executing memory wipe command...";
    document.getElementById('clearBtn').disabled = true;
    document.getElementById('metadata').style.display = 'none';

    try {
        const encoder = new TextEncoder();
        const clearCommand = encoder.encode('C');
        
        // Write 'C' to your existing Control Characteristic terminal link
        await controlChar.writeValueWithResponse(clearCommand);
        document.getElementById('globalCounter').innerText = "TOTAL MATCHES: 0";
        
        // Brief pause to let C3 variable tables clear out and settle
        await new Promise(resolve => setTimeout(resolve, 300));

        // Read back the fresh confirmation string from the metadata tracker
        const metaVal = await metaChar.readValue();
        const decoder = new TextDecoder();
        
        document.getElementById('metadata').innerText = decoder.decode(metaVal);
        document.getElementById('metadata').style.display = 'block';
        document.getElementById('status').innerText = "Status: Memory clear complete.";
        document.getElementById('imgContainer').innerHTML = ""; // Wipe current photo from view
    } catch (error) {
        document.getElementById('status').innerText = "Wipe Failed: " + error.message;
        console.error(error);
    } finally {
        document.getElementById('clearBtn').disabled = false;
    }
});


</script> 
</body>
</html>
